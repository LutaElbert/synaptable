    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      (() => {
        const FRAME_ID = "02-follow-the-connections";
        const DURATION = 10.862;
        const REVEAL_START = 2.6;
        const REVEAL_DURATION = 5.8;

        const heroVideo = document.getElementById("f02-product-video");
        const brandWord = document.getElementById(`${FRAME_ID}-brand-word`);
        const payoff = document.getElementById(`${FRAME_ID}-payoff`);

        const tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines[FRAME_ID] = tl;

        /*
         * The opening concept card center was measured in the 1920x1080 capture at
         * (758, 458). With a centered transform origin, T = -offset x S keeps that
         * real raster detail centered at the 1.14x opening crop.
         */
        const cam = {
          scale: 1.14,
          x: 230.28,
          y: 93.48,
        };

        function applyCamera() {
          if (!heroVideo) return;
          heroVideo.style.transformOrigin = "960px 540px";
          heroVideo.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
        }

        if (heroVideo) {
          heroVideo.style.filter = "brightness(0.88) saturate(0.92) contrast(0.99)";
        }
        applyCamera();

        tl.fromTo(
          cam,
          { scale: 1.14, x: 230.28, y: 93.48 },
          {
            scale: 1,
            x: 0,
            y: 0,
            duration: REVEAL_DURATION,
            ease: "expo.out",
            immediateRender: true,
            onUpdate: applyCamera,
          },
          REVEAL_START,
        );

        const keywordClock = { t: 0 };
        const keywordTiming = { start: 0.18, end: 0.92 };
        const ATTACK_DUR = 0.16;
        const RELEASE = 0.42;
        const REST_LEVEL = 0.18;

        function envelope(time, start, end) {
          if (time < start) return 0;
          if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
          const releaseEnd = end + RELEASE;
          if (time < releaseEnd) {
            return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
          }
          return REST_LEVEL;
        }

        function lerpChannel(a, b, amount) {
          return Math.round(a + (b - a) * amount);
        }

        function updateKeyword() {
          if (!brandWord) return;
          const amount = envelope(
            keywordClock.t,
            keywordTiming.start,
            keywordTiming.end,
          );
          brandWord.style.color = `rgb(${lerpChannel(24, 93, amount)}, ${lerpChannel(25, 88, amount)}, ${lerpChannel(29, 237, amount)})`;
          brandWord.style.textShadow = `0 0 ${24 * amount}px rgba(93, 88, 237, ${0.48 * amount})`;
          brandWord.style.transform = `scale(${1 + 0.08 * amount})`;
        }

        updateKeyword();
        tl.to(
          keywordClock,
          {
            t: DURATION,
            duration: DURATION,
            ease: "none",
            onUpdate: updateKeyword,
          },
          0,
        );

        tl.fromTo(
          payoff,
          { opacity: 0, y: 30, scale: 0.96 },
          {
            opacity: 1,
            y: 0,
            scale: 1,
            duration: 0.62,
            ease: "power3.out",
            immediateRender: true,
          },
          8.4,
        );
      })();
