      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines[frameId] = tl;

      tl.fromTo(
        tetherLine,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.48, ease: "power3.out" },
        2.62,
      );

      tl.fromTo(
        tetherDot,
        { scale: 0.72, opacity: 0 },

      );

      tl.fromTo(
        hero,

        { x: 0, scale: 1, opacity: 1, duration: 0.66, ease: "back.out(1.4)" },
        2.84,

      tl.fromTo(
        still,
        { scale: 0.8, opacity: 0 },

          duration: 0.55,

      const qualifierSequence = [

        { t: 0.08, text: "o" },

        { t: 0.68, text: "one local can" },
        { t: 0.78, text: "one local canvas" },
      ];

      const qualifierAt = (time) => {
        for (let index = qualifierSequence.length - 1; index >= 0; index -= 1) {
          if (time >= qualifierSequence[index].t) return qualifierSequence[index].text;
        }
        return "";
      };

      const qualifierDriver = { t: 0 };

        qualifierDriver,
        {
          t: 1,
          duration: 1,
          ease: "none",
          onUpdate: () => {
            qualifier.textContent = qualifierAt(qualifierDriver.t);
            cursor.style.opacity =
              qualifierDriver.t >= 0.9 || Math.sin(qualifierDriver.t * Math.PI * 9) <= 0
                ? "0"

        },
        4.92,
      );
