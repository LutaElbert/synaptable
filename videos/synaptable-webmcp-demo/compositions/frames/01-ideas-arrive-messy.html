    const world = document.getElementById("f01-ideas-arrive-messy-world");
    const target = document.getElementById("f01-ideas-arrive-messy-target");
    const root = document.getElementById("root");
    const rootRect = root.getBoundingClientRect();
    const targetRect = target.getBoundingClientRect();
    const targetOffsetX = targetRect.left + targetRect.width / 2 - (rootRect.left + rootRect.width / 2);
    const targetOffsetY = targetRect.top + targetRect.height / 2 - (rootRect.top + rootRect.height / 2);
    const openingScale = 4.5;

      scale: openingScale,
      x: -targetOffsetX * openingScale,
      y: -targetOffsetY * openingScale

    function applyCamera() {
      world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
    }

    applyCamera();

    const tl = gsap.timeline({ paused: true });

      { opacity: 0, y: 24 },
